<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Games</title>
    <link rel="icon" href="images/hangman-icon-symbol-design-illustration-vector.jpg" />
    <link rel="stylesheet" href="css/hangman.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="hangman-body">
    <div class="home active">
      <header>
        <a href="#" class="logo"><span class="logo-span">JS</span> Games </a>
        <div class="menu-btn">☰</div>
        <nav>
          <ul>
            <li class="nav-links"><a href="#home">Home</a></li>
            <li class="nav-links"><a href="#games-1">Games</a></li>
            <li class="nav-links"><a href="#about">About</a></li>
          </ul>
        </nav>
      </header>
      <section class="hero" id="home">
        <div class="hero-content">
          <h1>Welcome To <span class="logo-span">JS</span> Games 🎮</h1>
          <p>Exciting games made with JavaScript</p>
          <a href="#games" class="hero-btn">Play Now</a>
        </div>
      </section>
      <section id="games">
        <h2 id="games-1" class="sec-name">Games</h2>
        <div class="games-menu">
          <div class="game-card" id="play-hangman-btn">
            <h3>Hangman</h3>
          </div>
          <div class="game-card" id="play-xo-btn">
            <h3>X O</h3>
          </div>
        </div>
      </section>
      <section id="about">
        <h2 class="sec-name">About</h2>
        <div class="about-menu">
          <p>Ibrahim</p>
          <p>I Love JavaScript</p>
          <p>Front-end</p>
        </div>
      </section>
      <footer>
        <p>© 2026 JsGames</p>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-facebook"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin"></i></a>
          <a href="#"><i class="fa-brands fa-github"></i></a>
        </div>
      </footer>
    </div>
    <div class="container hidden">
      <h1 class="game-name">Hangman</h1>

      <div class="game-info">
        <button class="home-btn"><p class="home-txt">Home</p></button>
        <div class="categories-filter">
          <button class="cat-menu">اختار القسم ▼</button>
          <div class="cat-list">
            <button class="cat-btn active-cat" data-ar="الكل" data-en="All" data-cat="all">الكل</button>
            <button class="cat-btn" data-ar="حيوانات" data-en="Animals" data-cat="0">حيوانات</button>
            <button class="cat-btn" data-ar="برمجة" data-en="Programming" data-cat="1">برمجة</button>
            <button class="cat-btn" data-ar="بلدان" data-en="Countries" data-cat="2">بلدان</button>
          </div>
        </div>
        <div class="category"></div>
        <div class="lang">
          <button class="lang-btn">Turn To English</button>
        </div>
      </div>
      <hr />
      <div class="row">
        <div class="letters"></div>
        <div class="hangman-draw">
          <div class="the-draw">
            <div class="the-stand"></div>
            <div class="the-hang"></div>
            <div class="the-rope"></div>
            <div class="the-man">
              <div class="head"></div>
              <div class="body"></div>
              <div class="hands"></div>
              <div class="legs"></div>
            </div>
          </div>
        </div>
      </div>
      <hr />
      <div class="letters-guess"></div>
      <div class="loser-pop-up">
        <p></p>
        <div class="status-buttons">
          <button class="new-game">New Game</button>
          <button class="go-home">Home</button>
        </div>
      </div>

      <div class="winner-pop-up">
        <p>أحسنت ممتاز يابن اللعيبة انت جامد جدا</p>
        <div class="status-buttons">
          <button class="new-game">New Game</button>
          <button class="go-home">Home</button>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
